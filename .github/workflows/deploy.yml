name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
      - dev
      - staging
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies (Verify Locally)
        run: npm install

      - name: Build Project
        run: |
          npm run build

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DIGITALOCEAN_IP }}
          username: root
          key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          script: |
            cd /root/glowante/glowante-${{ github.ref_name }}/glowante-backend
            git pull origin ${{ github.ref_name }}

            npm install

            # Set up process name and environment
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              APP_NAME="glowante-prod"
              PORT=4000
              START_CMD="prod"
            elif [[ "${{ github.ref_name }}" == "dev" ]]; then
              APP_NAME="glowante-dev"
              PORT=4010
              START_CMD="dev"
            elif [[ "${{ github.ref_name }}" == "staging" ]]; then
              APP_NAME="glowante-staging"
              PORT=4020
              START_CMD="staging"
            elif [[ "${{ github.ref_name }}" == "uat" ]]; then
              APP_NAME="glowante-uat"
              PORT=4030
              START_CMD="uat"
            fi

            # Check if PM2 process exists, restart if running, start if not
            if pm2 list | grep -q $APP_NAME; then
              echo "✅ $APP_NAME is running. Restarting..."
              pm2 restart $APP_NAME
            else
              echo "⚠️ $APP_NAME is NOT running. Starting..."
              pm2 start npm --name "$APP_NAME" -- run "$START_CMD"
            fi

            # Save PM2 process list
            pm2 save